name: Upstream Sync Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    if: startsWith(github.head_ref, 'codex/sync-sub2api-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Guard SupplyGate-owned files
        run: bash .github/scripts/check-sub2api-sync-guard.sh "origin/${{ github.base_ref }}"
